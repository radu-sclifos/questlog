<section class="mb-4 border-t border-base-300 pt-5">

  <div class="flex flex-wrap items-center gap-3">
    <label class="input min-w-0 flex-1 basis-60">
      <svg class="size-5 shrink-0 opacity-60" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <path d="m16 16 4 4" />
      </svg>
      <input type="search" class="min-w-0 grow" placeholder="Search games…" #searchInput [value]="query().search"
             (input)="update('search', searchInput.value)" />
    </label>

    <label>
      <span class="sr-only">Status</span>
      <select class="select w-auto" #statusSelect [value]="query().status" (change)="updateStatus(statusSelect.value)">
        <option value="">All statuses</option>
        @for (status of statuses; track status) {
          <option [value]="status">{{ statusLabels[status] }}</option>
        }
      </select>
    </label>
  </div>

  <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <span class="text-sm text-base-content/60">{{ resultCount() }} {{ resultCount() === 1 ? 'game' : 'games' }}
        found</span>
      @if (hasFilters()) {
        <button type="button" class="btn btn-ghost btn-sm" (click)="clearFilters()">Clear filters</button>
      }
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <label class="flex items-center gap-2">
        <span class="text-sm text-base-content/60">Sort by</span>
        <select class="select w-auto" #sortSelect [value]="query().sortBy" (change)="updateSortBy(sortSelect.value)">
          <option value="title">Title</option>
          <option value="score">Rating</option>
        </select>
      </label>

      <button type="button"
              class="btn btn-square border-base-content/20 bg-base-100 shadow-none hover:border-base-content/40 hover:bg-base-200"
              (click)="reverseOrder()">
        <svg class="size-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          @if (query().sortDirection === 'asc') {
            <path d="M12 20V4m-7 7 7-7 7 7" />
          } @else {
            <path d="M12 4v16m-7-7 7 7 7-7" />
          }
        </svg>
      </button>
    </div>
  </div>

</section>
