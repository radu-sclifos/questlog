<section class="mb-4 border-t border-base-300 pt-5" [formGroup]="form">

  <div class="flex flex-wrap items-center gap-3">
    <label class="input min-w-0 flex-1 basis-60">
      <svg class="size-5 shrink-0 opacity-60" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <path d="m16 16 4 4" />
      </svg>
      <input type="search" class="min-w-0 grow" placeholder="Search games…" formControlName="search" />
    </label>

    <label>
      <span class="sr-only">Status</span>
      <select class="select w-auto" formControlName="status">
        <option value="">All statuses</option>
        @for (status of statuses; track status) {
          <option [value]="status">{{ statusLabels[status] }}</option>
        }
      </select>
    </label>
  </div>

  <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex flex-wrap items-center gap-3">
      <ng-content select="[pagination]" />
      @if (hasFilters()) {
        <span class="aura aura-xs text-primary">
        <button type="button"
                class="btn btn-sm gap-2 border-base-content/30 bg-base-200 text-base-content shadow-none hover:border-base-content/50 hover:bg-base-300"
                (click)="clearFilters()">
          <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
          Clear filters
        </button>
        </span>
      }
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <label class="flex items-center gap-2">
        <span class="text-sm text-base-content/60">Sort by</span>
        <select class="select w-auto" formControlName="sortBy">
          <option value="status">Status</option>
          <option value="game.name">Title</option>
          <option value="score">Rating</option>
        </select>
      </label>

      <button type="button"
              class="btn btn-square border-base-content/20 bg-base-100 shadow-none hover:border-base-content/40 hover:bg-base-200"
              (click)="reverseOrder()">
        <svg class="size-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          @if (form.controls.sortDirection.value === SortDirection.ASC) {
            <path d="M12 20V4m-7 7 7-7 7 7" />
          } @else {
            <path d="M12 4v16m-7-7 7 7 7-7" />
          }
        </svg>
      </button>
    </div>
  </div>

</section>
