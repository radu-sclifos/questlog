<dialog #dialog class="modal" aria-labelledby="entry-editor-title" (cancel)="onCancel($event)">
  <div class="modal-box max-w-xl">
    <h2 id="entry-editor-title" class="text-xl font-bold" tabindex="-1" autofocus>
      {{ editingEntry() ? 'Edit game' : 'Add a game' }}
    </h2>
    <p class="mt-2 text-sm text-base-content/60">
      {{ editingEntry() ? 'Update your progress and thoughts about the game.' : 'Start a new story in your library.' }}
    </p>

    <form class="mt-6" [formGroup]="form" (ngSubmit)="submit()">
      <fieldset class="grid gap-4 sm:grid-cols-2" [disabled]="saving()">
        <label class="fieldset sm:col-span-2">
          <span class="fieldset-legend">Title *</span>
          <input class="input w-full" formControlName="title" placeholder="Game title" maxlength="200" required />
          @if (form.controls.title.touched && form.controls.title.invalid) {
            <span id="entry-title-error" class="text-error">Enter a title (up to 200 characters).</span>
          }
        </label>

        <label class="fieldset">
          <span class="fieldset-legend">Status</span>
          <select class="select w-full" formControlName="status">
            @for (status of statuses; track status) {
              <option [ngValue]="status">{{ statusLabels[status] }}</option>
            }
          </select>
        </label>

        <label class="fieldset">
          <span class="fieldset-legend">Ownership</span>
          <select class="select w-full" formControlName="ownership">
            @for (ownership of ownerships; track ownership) {
              <option [ngValue]="ownership">{{ ownershipLabels[ownership] }}</option>
            }
          </select>
        </label>

        <label class="fieldset">
          <span class="fieldset-legend">Score</span>
          <input class="input w-full" type="number" formControlName="score" min="0" max="10" step="0.5"
                 placeholder="0 - 10" />
          @if (form.controls.score.touched && form.controls.score.invalid) {
            <span class="text-error">Choose a score between 0 and 10.</span>
          }
        </label>

        <label class="fieldset">
          <span class="fieldset-legend">Playtime (hours)</span>
          <input class="input w-full" type="number" formControlName="playtime" min="0" step="1" placeholder="-" />
          @if (form.controls.playtime.touched && form.controls.playtime.invalid) {
            <span class="text-error">Enter a whole number of hours, at least 0.</span>
          }
        </label>

        <label class="fieldset sm:col-span-2">
          <span class="fieldset-legend">Notes</span>
          <textarea class="textarea w-full" formControlName="notes" rows="3" maxlength="2000"
                    placeholder="Your thoughts about the game"></textarea>
          <span class="text-base-content/50">{{ form.controls.notes.value.length }}/2000</span>
        </label>
      </fieldset>

      @if (errorMessage(); as message) {
        <div class="alert alert-error mt-4" role="alert">{{ message }}</div>
      }

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" [disabled]="saving()" (click)="close()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          @if (saving()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          {{ saving() ? 'Saving...' : editingEntry() ? 'Edit game' : 'Add game' }}
        </button>
      </div>
    </form>
  </div>
  <div class="modal-backdrop"></div>
</dialog>
