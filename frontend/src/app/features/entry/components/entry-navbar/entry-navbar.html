<nav class="entry-sidebar" aria-label="Library actions">

  <button type="button" class="entry-sidebar__button tooltip tooltip-right tooltip-primary" aria-label="Profile" data-tip="Profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
    </svg>
  </button>

  <button type="button" class="entry-sidebar__button tooltip tooltip-right tooltip-primary" aria-label="Add a game" data-tip="Add a game" (click)="addEntry.emit()">

      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>

  <button type="button" class="entry-sidebar__button tooltip tooltip-right tooltip-primary"
          aria-label="Sign out" data-tip="Sign out" (click)="logout()" [disabled]="signingOut()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
    </svg>
