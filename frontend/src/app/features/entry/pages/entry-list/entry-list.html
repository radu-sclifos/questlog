<app-entry-navbar (addEntry)="editorDialog.open()" />

<app-entry-editor-dialog #editorDialog (savedEntry)="onEntrySaved($event)" />
<app-entry-delete-dialog #deleteDialog (deletedEntry)="onEntryDeleted($event)" />

<div class="mx-auto max-w-5xl">
  <header class="mb-8">
    <p class="mb-3 text-xs font-semibold uppercase tracking-[0.25em] text-primary">QuestLog · Your game diary</p>
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Your library</h1>
    <p class="mt-3 max-w-xl text-sm leading-relaxed text-base-content/60">
      Every game has a story. Open the card for progress, notes, and more.
    </p>
  </header>

  @if (errorMessage(); as message) {
    <p>{{ message }}</p>
  }

  @for (entry of entries(); track entry.id) {
    <app-entry-card [entry]="entry" [canEdit]="canEdit" (editRequested)="editorDialog.open($event)"
                    (deleteRequested)="deleteDialog.open($event)" />
  }

</div>
